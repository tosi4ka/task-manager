basePath: /
definitions:
  auth.AppError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  auth.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  auth.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      password:
        type: string
      updated_at:
        type: string
    type: object
  task.AppError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  task.CreateTaskRequest:
    properties:
      assigned_by:
        type: string
      assigned_to:
        type: string
      description:
        type: string
      estimate:
        type: integer
      title:
        type: string
    type: object
  task.Task:
    properties:
      assigned_by:
        type: string
      assigned_to:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      description:
        type: string
      estimate:
        type: integer
      id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  task.UpdateTaskRequest:
    properties:
      assigned_to:
        type: string
      completed_at:
        type: string
      description:
        type: string
      estimate:
        type: integer
      status:
        type: string
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API для управления задачами
  title: Task Manager API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.AppError'
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: User Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.AppError'
      summary: User registration
      tags:
      - auth
  /task/createTask:
    post:
      consumes:
      - application/json
      parameters:
      - description: Task creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/task.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.AppError'
      security:
      - BearerAuth: []
      summary: Creating a task
      tags:
      - tasks
  /task/deleteTask/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: ID of the task to delete
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.AppError'
      security:
      - BearerAuth: []
      summary: Delete task
      tags:
      - tasks
  /task/getById/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID of the task to retrieve
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.AppError'
      security:
      - BearerAuth: []
      summary: Find task by ID
      tags:
      - tasks
  /task/tasksList/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: ID of the user whose tasks to retrieve
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/task.Task'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.AppError'
      security:
      - BearerAuth: []
      summary: Show all users tasks
      tags:
      - tasks
  /task/updateTask:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Fields to update (all optional)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/task.UpdateTaskRequest'
      - description: ID of the task to update
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/task.Task'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/task.AppError'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
